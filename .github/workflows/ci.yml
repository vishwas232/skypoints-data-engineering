name: Local pipeline checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check installed dependency compatibility
        run: python -m pip check
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Validate native CLI without Snowflake credentials
        run: python -m src.pipeline --help
      - name: Validate source inputs without Snowflake
        run: python -m src.ingest_raw --feed members --dry-run
      - name: Validate redemption adapter without member linkage
        run: python -m src.transform_redemptions --dry-run --json-file data/samples/redemptions/example.json --as-of 2026-11-18
